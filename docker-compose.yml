version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: airquality-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: airquality_user
      POSTGRES_PASSWORD: airquality_dev_password
      POSTGRES_DB: airquality_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airquality_user -d airquality_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
